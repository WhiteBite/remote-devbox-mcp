# remote-devbox-mcp — твой комп как toolbox для арена-агента (меня).
#
# Принцип: ОДИН сервис, ОДИН проект, ОДНА переменная.
#   Меняешь PROJECT_DIR в .env  →  docker compose up -d  →  работаю с другим проектом.
#
# Внутри нет ни агента, ни LLM: мост только исполняет тулы OpenCode
# (read/write/edit/apply_patch/glob/grep/bash/lsp), решения принимает агент.
# Образ стеково-нейтральный: тулчейны проекта — build-аргументы WITH_JAVA /
# WITH_FLUTTER, всё остальное агент ставит рантайм в /opt/tools (volume).
# Кастомные тулы агента (playwright, codegraph) живут в ЕГО песочнице, не здесь.

services:

  toolbox:
    build:
      context: ./docker
      dockerfile: toolbox.Dockerfile
      args:
        WITH_JAVA: "${WITH_JAVA:-0}"            # 1 — JDK 21 для Java/Spring и jdtls
        WITH_FLUTTER: "${WITH_FLUTTER:-0}"      # 1 — Flutter/Dart SDK (~4 ГБ)
        FLUTTER_CHANNEL: "${FLUTTER_CHANNEL:-stable}"   # тег/канал под пин проекта
    image: remote-devbox-toolbox:local
    container_name: rdm-toolbox
    restart: unless-stopped
    init: true                                  # reap зомби от exec'ов
    environment:
      # корень = твоя папка проекта; выход за неё мост отвергает, а не спрашивает
      OPENCODE_MCP_ROOT: /workspace
      OPENCODE_MCP_TOKEN: "${MCP_BEARER_TOKEN:?задай в .env, минимум 24 символа}"
      OPENCODE_MCP_HOST: 0.0.0.0                # по умолчанию 127.0.0.1 — извне не достучаться
      OPENCODE_MCP_PORT: "8787"
      OPENCODE_MCP_LSP: "true"                  # публикует тул lsp (jdtls для .java, dart для .dart — при их наличии в образе)
      # сборки Spring/Flutter долгие: дефолт 600 с, максимум по документам 3600
      OPENCODE_MCP_JOB_TIMEOUT_SECONDS: "${JOB_TIMEOUT_SECONDS:-1800}"
      OPENCODE_MCP_WAIT_MAX_SECONDS: "50"
      # Правила auto-allow для write/edit/apply_patch/bash. Схема — нативные
      # правила разрешений OpenCode; по умолчанию пусто и клиент отвечает на
      # запросы сам (./mcp run --auto).
      # OPENCODE_MCP_PERMISSIONS: '{"edit":"allow","bash":"allow"}'
    volumes:
      - "${PROJECT_DIR:?укажи папку проекта в .env}:/workspace"
      # shadow-монт: воркер не видит opencode.json проекта и не пытается поднять
      # его MCP-серверы внутри контейнера (деградация старта); диск не меняется
      - ./docker/workspace-opencode.json:/workspace/opencode.json:ro
      - rdm-state:/state                        # TODO/сессии моста, вне проекта
      - rdm-tools:/opt/tools                    # рантайм-тулчейны, переживают пересоздание
    expose:
      - "8787"
      - "8788"                                  # preview: flutter web-server / bootRun для агента
    # Loopback-проброс на хост: нужен альтернативным туннелям (ssh -R, tailscale
    # funnel, localhost.run), когда cloudflared деградирует из-за DPI провайдера
    # (см. cloudflare/cloudflared#1456 и README «Если что-то не так»).
    # Только 127.0.0.1 — снаружи не видно; мост по-прежнему требует токен.
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"

  # Встроенный VPN: VLESS-подписка -> sing-box в TUN-режиме. Туннели
  # cloudflared делят его netns — провайдеру виден только VLESS-трафик,
  # DPI против края Cloudflare до туннеля не достаёт (issue #1456).
  vpn:
    build:
      context: ./docker
      dockerfile: vpn.Dockerfile
    image: remote-devbox-vpn:local
    container_name: rdm-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      VLESS_SUB_URL: "${VLESS_SUB_URL:-}"
    volumes:
      - rdm-vpn-cache:/cache                 # последняя удачная подписка
    healthcheck:
      # прямой режим (без подписки) = всегда healthy; в VPN-режиме требуем tun0
      test: ["CMD-SHELL", "test ! -f /run/vpn-active || ip link show tun0 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Единственный выход наружу: туннель наружу, входящих портов на роутере нет.
  # Трафик идёт через VPN-сайдкар (network_mode: container:rdm-vpn).
  # --protocol http2: QUIC (UDP 7844) на некоторых сетях нестабилен.
  # Быстрый вариант (URL меняется при перезапуске):
  #     docker compose logs cloudflared | Select-String trycloudflare
  # Именованный туннель: TUNNEL_TOKEN в .env + command `tunnel --no-autoupdate run`,
  # ingress — cloudflared-config.example.yml.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rdm-tunnel
    restart: unless-stopped
    network_mode: container:rdm-vpn
    depends_on:
      toolbox:
        condition: service_started
      vpn:
        condition: service_healthy
    command: tunnel --no-autoupdate --protocol http2 --url http://toolbox:8787
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"

  # Preview для агента: ВТОРОЙ быстрый туннель на порт 8788 (виджетбук /
  # flutter web-server / bootRun). По умолчанию выключен — поднимай на время
  # проверки UI:
  #     docker compose --profile preview up -d
  #     docker compose logs cloudflared-preview | Select-String trycloudflare
  #     docker compose stop cloudflared-preview     # когда закончили
  # Токена на этом URL нет: кто знает URL — видит приложение.
  cloudflared-preview:
    image: cloudflare/cloudflared:latest
    container_name: rdm-tunnel-preview
    restart: unless-stopped
    profiles: ["preview"]
    network_mode: container:rdm-vpn
    depends_on:
      toolbox:
        condition: service_started
      vpn:
        condition: service_healthy
    command: tunnel --no-autoupdate --protocol http2 --url ${PREVIEW_ORIGIN:-http://toolbox:8788}

# Будущая опция: семантический граф кода (codegraph) агент индексирует у себя
# в песочнице (см. arena/AGENT_INSTRUCTIONS.md §6) — в этот стек он не входит.

  # Скриншоты для оценки агентом: статический сервер на ХОСТЕ (порт 8791),
  # туннель из netns vpn-сайдкара. На хосте поднять сервер:
  #   python -m http.server 8791 --directory <папка со скриншотами>
  # URL без токена: поднимать только на время сессии оценки, потом стоп.
  cloudflared-shots:
    image: cloudflare/cloudflared:latest
    container_name: rdm-tunnel-shots
    restart: unless-stopped
    profiles: ["shots"]
    network_mode: container:rdm-vpn
    depends_on:
      vpn:
        condition: service_healthy
    command: tunnel --no-autoupdate --protocol http2 --url http://host.docker.internal:8791

  # Локальные MCP наружу (muffin-supervisor и пр.): сервер + bearer-прокси
  # на хосте (loopback), туннель из netns vpn-сайдкара. Запуск цепочки:
  #   home\host\start-mcp-public.ps1   (MCP_PUBLIC_TOKEN из .env)
  #   docker compose --profile mcp up -d
  #   docker compose logs cloudflared-mcp | Select-String trycloudflare
  cloudflared-mcp:
    image: cloudflare/cloudflared:latest
    container_name: rdm-tunnel-mcp
    restart: unless-stopped
    profiles: ["mcp"]
    network_mode: container:rdm-vpn
    depends_on:
      vpn:
        condition: service_healthy
    command: tunnel --no-autoupdate --protocol http2 --url http://host.docker.internal:8792

volumes:
  rdm-state:
  rdm-tools:
  rdm-vpn-cache:
