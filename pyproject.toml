[project]
name = "remote-devbox-mcp"
version = "0.0.0"
description = "Turn your own machine into a remote devbox for an agent via Docker and Cloudflare tunnels."
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
pythonpath = ["home"]
testpaths = ["tests"]
addopts = "-q"
timeout = 60

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.10"
