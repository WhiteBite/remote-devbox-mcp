name: rdk-audit

on:
  pull_request:
  workflow_dispatch:
    inputs:
      min_score:
        description: 'Fail the run when the Discoverability Score is below this value'
        required: false
        default: '0'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes repo-aeo@^0.3.0 audit --format github-comment --online --out rdk-comment.md
      - run: npx --yes repo-aeo@^0.3.0 audit --format json --online --out rdk-report.json --min-score "${{ github.event.inputs.min_score || vars.RDK_MIN_SCORE || 0 }}"
